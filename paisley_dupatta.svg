<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <radialGradient id="dupatta-bg" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#FCF9F2"/>
      <stop offset="100%" stop-color="#EDE2D1"/>
    </radialGradient>
  </defs>
  <rect width="600" height="600" fill="url(#dupatta-bg)"/>

  <!-- Geometric & Block-print repetitive border -->
  <rect x="25" y="25" width="550" height="550" fill="none" stroke="#1B365D" stroke-width="10"/>
  <rect x="42" y="42" width="516" height="516" fill="none" stroke="#A93C24" stroke-width="4" stroke-dasharray="12 6"/>
  <rect x="54" y="54" width="492" height="492" fill="none" stroke="#D4A017" stroke-width="2"/>

  <!-- Center Botanical Paisley (Mankolam / Ambi) -->
  <g transform="translate(300, 280) scale(1.15)">
    <!-- Main Paisley Teardrop Shape -->
    <path d="M 0 110 C -80 110 -110 30 -70 -50 C -40 -110 10 -140 30 -190 C 45 -140 10 -90 50 -50 C 90 -10 80 110 0 110 Z" fill="#1B365D"/>
    <!-- Inner Paisley Layer -->
    <path d="M 0 90 C -60 90 -85 25 -55 -40 C -30 -90 10 -115 25 -155 C 35 -115 10 -75 40 -40 C 70 -5 60 90 0 90 Z" fill="#A93C24"/>
    <!-- Intricate Core Motif -->
    <path d="M 0 70 C -40 70 -60 20 -40 -30 C -20 -70 5 -90 15 -125 C 20 -90 5 -60 25 -30 C 45 0 40 70 0 70 Z" fill="#D4A017"/>
    <circle cx="-5" cy="10" r="14" fill="#FFFDF7"/>
    <circle cx="-5" cy="10" r="6" fill="#1B365D"/>
    
    <!-- Radiating Floral petals around paisley curve -->
    <circle cx="-85" cy="15" r="8" fill="#D4A017"/>
    <circle cx="-90" cy="-25" r="7" fill="#A93C24"/>
    <circle cx="-70" cy="-65" r="7" fill="#1B365D"/>
    <circle cx="-40" cy="-100" r="6" fill="#D4A017"/>
    <circle cx="65" cy="15" r="8" fill="#D4A017"/>
    <circle cx="65" cy="-25" r="7" fill="#A93C24"/>
  </g>

  <!-- Surrounding Floral Jaal / Buds -->
  <g fill="#A93C24" opacity="0.8">
    <circle cx="130" cy="130" r="14"/>
    <circle cx="470" cy="130" r="14"/>
    <circle cx="130" cy="450" r="14"/>
    <circle cx="470" cy="450" r="14"/>
  </g>
  <g fill="#1B365D" opacity="0.7">
    <circle cx="130" cy="130" r="7"/>
    <circle cx="470" cy="130" r="7"/>
    <circle cx="130" cy="450" r="7"/>
    <circle cx="470" cy="450" r="7"/>
  </g>

  <!-- Badge Label -->
  <rect x="170" y="525" width="260" height="34" rx="17" fill="#1B365D"/>
  <text x="300" y="547" fill="#FFFDF7" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" letter-spacing="1">MACHILIPATNAM BLOCK DUPATTA</text>
</svg>
