<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <radialGradient id="parchment" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFDF7"/>
      <stop offset="100%" stop-color="#F4ECE1"/>
    </radialGradient>
    <filter id="craft-shadow">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-color="#1A365D" flood-opacity="0.15"/>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="600" height="600" fill="url(#parchment)"/>
  
  <!-- Kalamkari Border -->
  <rect x="25" y="25" width="550" height="550" fill="none" stroke="#A93C24" stroke-width="8" stroke-dasharray="16 8"/>
  <rect x="40" y="40" width="520" height="520" fill="none" stroke="#1B365D" stroke-width="3"/>
  
  <!-- Corner Floral Flourishes -->
  <circle cx="50" cy="50" r="10" fill="#D4A017"/>
  <circle cx="550" cy="50" r="10" fill="#D4A017"/>
  <circle cx="50" cy="550" r="10" fill="#D4A017"/>
  <circle cx="550" cy="550" r="10" fill="#D4A017"/>

  <!-- Tree of Life Center Artwork -->
  <!-- Base Mound -->
  <path d="M150 490 Q300 440 450 490 L460 520 L140 520 Z" fill="#A93C24" opacity="0.9"/>
  <path d="M180 480 Q300 450 420 480" stroke="#D4A017" stroke-width="3" fill="none"/>
  
  <!-- Trunk -->
  <path d="M280 470 C270 380 260 300 300 230 C340 300 330 380 320 470 Z" fill="#2C2523"/>
  <path d="M295 470 C290 380 285 310 300 240" stroke="#D4A017" stroke-width="2" fill="none"/>

  <!-- Main Branches & Leaf Canopy -->
  <!-- Left Branches -->
  <path d="M285 360 C210 350 160 320 130 250 C180 250 230 280 280 320" fill="none" stroke="#A93C24" stroke-width="7" stroke-linecap="round"/>
  <path d="M275 290 C200 260 170 200 150 140 C210 160 250 210 280 250" fill="none" stroke="#1B365D" stroke-width="6" stroke-linecap="round"/>
  <path d="M290 240 C240 180 220 120 230 80 C270 110 290 160 295 210" fill="none" stroke="#A93C24" stroke-width="5" stroke-linecap="round"/>

  <!-- Right Branches -->
  <path d="M315 360 C390 350 440 320 470 250 C420 250 370 280 320 320" fill="none" stroke="#A93C24" stroke-width="7" stroke-linecap="round"/>
  <path d="M325 290 C400 260 430 200 450 140 C390 160 350 210 320 250" fill="none" stroke="#1B365D" stroke-width="6" stroke-linecap="round"/>
  <path d="M310 240 C360 180 380 120 370 80 C330 110 310 160 305 210" fill="none" stroke="#A93C24" stroke-width="5" stroke-linecap="round"/>

  <!-- Crown Leaves & Sacred Flowers -->
  <circle cx="300" cy="110" r="22" fill="#D4A017"/>
  <circle cx="300" cy="110" r="14" fill="#A93C24"/>
  <circle cx="300" cy="110" r="6" fill="#FFFDF7"/>

  <circle cx="230" cy="130" r="18" fill="#1B365D"/>
  <circle cx="230" cy="130" r="10" fill="#D4A017"/>

  <circle cx="370" cy="130" r="18" fill="#1B365D"/>
  <circle cx="370" cy="130" r="10" fill="#D4A017"/>

  <circle cx="160" cy="190" r="16" fill="#A93C24"/>
  <circle cx="160" cy="190" r="8" fill="#FFFDF7"/>

  <circle cx="440" cy="190" r="16" fill="#A93C24"/>
  <circle cx="440" cy="190" r="8" fill="#FFFDF7"/>

  <circle cx="140" cy="280" r="15" fill="#D4A017"/>
  <circle cx="460" cy="280" r="15" fill="#D4A017"/>

  <!-- Peacocks Perched on Tree -->
  <!-- Left Peacock -->
  <path d="M220 370 C200 350 190 320 205 300 C215 310 220 330 235 340 Z" fill="#1B365D"/>
  <path d="M205 300 Q195 290 190 280 Q205 285 210 295" stroke="#D4A017" stroke-width="2" fill="none"/>
  
  <!-- Right Peacock -->
  <path d="M380 370 C400 350 410 320 395 300 C385 310 380 330 365 340 Z" fill="#1B365D"/>
  <path d="M395 300 Q405 290 410 280 Q395 285 390 295" stroke="#D4A017" stroke-width="2" fill="none"/>

  <!-- Badge Label -->
  <rect x="180" y="530" width="240" height="34" rx="17" fill="#1B365D"/>
  <text x="300" y="552" fill="#FFFDF7" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" letter-spacing="1">SRIKALAHASTI PEN KALAMKARI</text>
</svg>
