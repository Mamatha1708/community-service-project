<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <linearGradient id="silk-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF0E1"/>
      <stop offset="100%" stop-color="#EEDAC0"/>
    </linearGradient>
  </defs>
  <rect width="600" height="600" fill="url(#silk-gold)"/>
  
  <!-- Outer Zari & Kalamkari Border -->
  <rect x="20" y="20" width="560" height="560" fill="none" stroke="#D4A017" stroke-width="6"/>
  <rect x="32" y="32" width="536" height="536" fill="none" stroke="#A93C24" stroke-width="4"/>
  <rect x="42" y="42" width="516" height="516" fill="none" stroke="#1B365D" stroke-width="2" stroke-dasharray="10 5"/>

  <!-- Ornate Dancing Peacock Motif -->
  <!-- Peacock Body -->
  <path d="M270 330 C250 300 250 250 280 210 C300 180 300 150 290 120 C320 135 330 170 315 210 C335 240 340 300 310 340 Z" fill="#1B365D"/>
  
  <!-- Crest / Kalgi on Head -->
  <circle cx="285" cy="100" r="4" fill="#D4A017"/>
  <path d="M285 104 L290 120" stroke="#D4A017" stroke-width="2"/>
  <circle cx="295" cy="98" r="4" fill="#A93C24"/>
  <path d="M295 102 L292 120" stroke="#A93C24" stroke-width="2"/>
  <circle cx="305" cy="104" r="4" fill="#1B365D"/>
  <path d="M305 108 L295 120" stroke="#1B365D" stroke-width="2"/>

  <!-- Beak and Eye -->
  <polygon points="275,130 255,135 273,140" fill="#D4A017"/>
  <circle cx="282" cy="132" r="3" fill="#FFFDF7"/>
  <circle cx="282" cy="132" r="1.5" fill="#2C2523"/>

  <!-- Majestic Tail Feather Fan (Plumes) -->
  <g stroke="#1B365D" stroke-width="3" fill="none">
    <!-- Plume radiating curves -->
    <path d="M310 330 C380 340 440 280 470 200"/>
    <path d="M310 330 C400 300 460 210 450 130"/>
    <path d="M310 330 C380 250 420 150 380 90"/>
    <path d="M310 330 C340 230 360 120 330 60"/>
    <path d="M310 330 C300 240 270 140 230 80"/>
    <path d="M300 330 C260 260 210 170 170 120"/>
    <path d="M300 330 C230 280 160 220 130 180"/>
    <path d="M290 340 C210 330 140 280 110 250"/>
  </g>

  <!-- Feather Eyes (Eyespots) -->
  <g>
    <!-- 1 -->
    <ellipse cx="470" cy="200" rx="20" ry="14" fill="#D4A017" transform="rotate(-30 470 200)"/>
    <ellipse cx="470" cy="200" rx="14" ry="9" fill="#1B365D" transform="rotate(-30 470 200)"/>
    <circle cx="470" cy="200" r="5" fill="#A93C24"/>

    <!-- 2 -->
    <ellipse cx="450" cy="130" rx="20" ry="14" fill="#D4A017" transform="rotate(-15 450 130)"/>
    <ellipse cx="450" cy="130" rx="14" ry="9" fill="#1B365D" transform="rotate(-15 450 130)"/>
    <circle cx="450" cy="130" r="5" fill="#A93C24"/>

    <!-- 3 -->
    <ellipse cx="380" cy="90" rx="20" ry="14" fill="#D4A017" transform="rotate(10 380 90)"/>
    <ellipse cx="380" cy="90" rx="14" ry="9" fill="#1B365D" transform="rotate(10 380 90)"/>
    <circle cx="380" cy="90" r="5" fill="#A93C24"/>

    <!-- 4 -->
    <ellipse cx="230" cy="80" rx="20" ry="14" fill="#D4A017" transform="rotate(-10 230 80)"/>
    <ellipse cx="230" cy="80" rx="14" ry="9" fill="#1B365D" transform="rotate(-10 230 80)"/>
    <circle cx="230" cy="80" r="5" fill="#A93C24"/>

    <!-- 5 -->
    <ellipse cx="170" cy="120" rx="20" ry="14" fill="#D4A017" transform="rotate(25 170 120)"/>
    <ellipse cx="170" cy="120" rx="14" ry="9" fill="#1B365D" transform="rotate(25 170 120)"/>
    <circle cx="170" cy="120" r="5" fill="#A93C24"/>

    <!-- 6 -->
    <ellipse cx="120" cy="200" rx="20" ry="14" fill="#D4A017" transform="rotate(45 120 200)"/>
    <ellipse cx="120" cy="200" rx="14" ry="9" fill="#1B365D" transform="rotate(45 120 200)"/>
    <circle cx="120" cy="200" r="5" fill="#A93C24"/>
  </g>

  <!-- Ornate Lotus Pedestal -->
  <path d="M220 440 C260 410 340 410 380 440 C340 460 260 460 220 440 Z" fill="#A93C24"/>
  <path d="M190 450 C240 420 360 420 410 450 C350 480 250 480 190 450 Z" fill="#D4A017" opacity="0.6"/>

  <!-- Badge Label -->
  <rect x="175" y="525" width="250" height="34" rx="17" fill="#A93C24"/>
  <text x="300" y="547" fill="#FFFDF7" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" letter-spacing="1">AUTHENTIC TUSSAR SILK SAREE</text>
</svg>
